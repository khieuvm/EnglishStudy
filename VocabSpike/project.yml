name: VocabSpike

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Điền Team ID của bạn (Xcode > Settings > Accounts > Manage Certificates,
    # hoặc xem ở developer.apple.com/account > Membership details).
    # Để trống cũng được — Xcode sẽ hỏi khi build lần đầu.
    DEVELOPMENT_TEAM: ""

targets:

  VocabSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vocabspike
        PRODUCT_NAME: VocabSpike
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: Sources/App/VocabSpike.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: VocabSpike
    dependencies:
      - target: VocabSpikeWidgetExtension

  VocabSpikeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
        excludes:
          - Info.plist
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vocabspike.widget
        PRODUCT_NAME: VocabSpikeWidgetExtension
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/VocabSpikeWidget.entitlements
        SKIP_INSTALL: "YES"
